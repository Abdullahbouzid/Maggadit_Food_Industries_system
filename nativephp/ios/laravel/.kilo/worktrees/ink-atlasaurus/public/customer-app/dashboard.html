<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="description" content="ماغاديت - لوحة التحكم">
    <meta name="theme-color" content="#7c3aed">
    <title>Maggadit - الرئيسية</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="app-container" id="app">
        <!-- Header -->
        <header class="app-header">
            <div></div>
            <h1 class="header-title">ماغاديت</h1>
            <div class="header-actions">
                <button class="header-back" id="btn-logout" title="تسجيل الخروج" style="font-size: 0.9rem;">🚪</button>
            </div>
        </header>

        <!-- Content -->
        <div class="page-content" id="content">
            <!-- Skeleton loading -->
            <div id="skeleton">
                <div class="skeleton" style="height: 120px; margin-bottom: 24px;"></div>
                <div style="display: flex; gap: 12px; margin-bottom: 24px;">
                    <div class="skeleton skeleton-circle" style="width: 64px; height: 64px;"></div>
                    <div class="skeleton skeleton-circle" style="width: 64px; height: 64px;"></div>
                    <div class="skeleton skeleton-circle" style="width: 64px; height: 64px;"></div>
                    <div class="skeleton skeleton-circle" style="width: 64px; height: 64px;"></div>
                </div>
                <div class="skeleton" style="height: 200px;"></div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        if (!App.requireAuth()) { /* redirects */ }

        // Ads data
        const ads = [
            { title: 'خصم 50% على المنتجات', subtitle: 'سارع بالشراء', icon: '🛍️', gradient: 'gradient-1' },
            { title: 'عرض الإلكترونيات', subtitle: 'خصم 30%', icon: '📱', gradient: 'gradient-2' },
            { title: 'توصيل مجاني', subtitle: 'للطلبات فوق 200 ر.س', icon: '🚚', gradient: 'gradient-3' },
            { title: 'منتجات فاخرة', subtitle: 'خصم 25%', icon: '🌸', gradient: 'gradient-4' },
            { title: 'منتجات رياضية', subtitle: 'تخفيضات تصل 40%', icon: '👟', gradient: 'gradient-5' },
            { title: 'أجهزة ذكية', subtitle: 'عرض خاص', icon: '⌚', gradient: 'gradient-6' },
        ];

        async function loadDashboard() {
            try {
                const response = await API.getDashboard();
                const { categories, brands, products } = response;

                const content = document.getElementById('content');
                content.innerHTML = '';

                // ===== Carousel =====
                const carouselSection = document.createElement('div');
                carouselSection.className = 'carousel-container';
                carouselSection.innerHTML = `
                    <div class="carousel" id="ad-carousel">
                        ${ads.map(ad => `
                            <div class="carousel-item">
                                <div class="carousel-card ${ad.gradient}">
                                    <div>
                                        <h3>${ad.title}</h3>
                                        <p>${ad.subtitle}</p>
                                        <button class="carousel-btn">اشتري الآن</button>
                                    </div>
                                    <span class="emoji">${ad.icon}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="carousel-dots" id="ad-dots">
                        ${ads.map((_, i) => `<div class="carousel-dot ${i === 0 ? 'active' : ''}" data-index="${i}"></div>`).join('')}
                    </div>
                `;
                content.appendChild(carouselSection);

                // ===== Categories =====
                if (categories && categories.length > 0) {
                    const catSection = document.createElement('div');
                    catSection.className = 'section';
                    catSection.innerHTML = `
                        <div class="section-header">
                            <h2 class="section-title">الفئات</h2>
                            <a class="section-link" onclick="App.navigate('categories.html')">عرض الكل</a>
                        </div>
                    `;
                    const catScroll = document.createElement('div');
                    catScroll.className = 'h-scroll';
                    categories.forEach(cat => {
                        catScroll.appendChild(App.renderCategoryCard(cat, 'small'));
                    });
                    catSection.appendChild(catScroll);
                    content.appendChild(catSection);
                }

                // ===== Brands =====
                if (brands && brands.length > 0) {
                    const brandSection = document.createElement('div');
                    brandSection.className = 'section';
                    brandSection.innerHTML = `
                        <div class="section-header">
                            <h2 class="section-title">ماركات شهيرة</h2>
                            <a class="section-link" onclick="App.navigate('brands.html')">عرض الكل</a>
                        </div>
                    `;
                    const brandScroll = document.createElement('div');
                    brandScroll.className = 'h-scroll';
                    brands.forEach(brand => {
                        brandScroll.appendChild(App.renderBrandCard(brand, 'small'));
                    });
                    brandSection.appendChild(brandScroll);
                    content.appendChild(brandSection);
                }

                // ===== Products =====
                const prodSection = document.createElement('div');
                prodSection.className = 'section';
                prodSection.innerHTML = `
                    <div class="section-header">
                        <h2 class="section-title">أفضل المنتجات</h2>
                        <a class="section-link" onclick="App.navigate('products.html')">عرض الكل</a>
                    </div>
                `;

                if (products && products.length > 0) {
                    const grid = document.createElement('div');
                    grid.className = 'product-grid';
                    products.forEach(p => {
                        grid.appendChild(App.renderProductCard(p));
                    });
                    prodSection.appendChild(grid);
                } else {
                    prodSection.appendChild(App.renderEmptyState('📦', 'لا توجد منتجات لعرضها'));
                }
                content.appendChild(prodSection);

                // ===== Offers (static demo) =====
                const offersSection = document.createElement('div');
                offersSection.className = 'section';
                offersSection.innerHTML = `
                    <div class="section-header">
                        <h2 class="section-title">عروض حصرية</h2>
                    </div>
                    <div class="offer-card">
                        <div class="offer-card-inner">
                            <div class="offer-image">
                                <div class="gradient-bg gradient-5">🛍️</div>
                                <span class="offer-badge">-50%</span>
                            </div>
                            <div class="offer-content">
                                <h3 class="offer-title">تخفيضات الصيف الكبرى</h3>
                                <p class="offer-desc">خصم يصل إلى 50% على جميع المنتجات الغذائية. سارع بالشراء!</p>
                                <div class="offer-expiry">⏰ ينتهي: 31 يوليو 2026</div>
                            </div>
                        </div>
                    </div>
                    <div class="offer-card">
                        <div class="offer-card-inner">
                            <div class="offer-image">
                                <div class="gradient-bg gradient-2">📦</div>
                                <span class="offer-badge">-30%</span>
                            </div>
                            <div class="offer-content">
                                <h3 class="offer-title">عرض خاص على المنتجات الجديدة</h3>
                                <p class="offer-desc">احصل على خصم 30% على أحدث المنتجات لفترة محدودة.</p>
                                <div class="offer-expiry">⏰ ينتهي: 15 أغسطس 2026</div>
                            </div>
                        </div>
                    </div>
                `;
                content.appendChild(offersSection);

                // Add spacing at bottom
                const spacer = document.createElement('div');
                spacer.style.height = '24px';
                content.appendChild(spacer);

                // Init carousel
                App.initCarousel(
                    document.getElementById('ad-carousel'),
                    document.getElementById('ad-dots')
                );

                // Render bottom nav
                App.renderBottomNav('home');

            } catch (error) {
                document.getElementById('content').innerHTML = '';
                document.getElementById('content').appendChild(
                    App.renderEmptyState('❌', error.message || 'حدث خطأ أثناء تحميل البيانات')
                );
                App.renderBottomNav('home');
            }
        }

        // Logout
        document.getElementById('btn-logout').addEventListener('click', async () => {
            if (confirm('هل تريد تسجيل الخروج؟')) {
                await API.logout();
                window.location.href = 'index.html';
            }
        });

        loadDashboard();
    </script>
</body>
</html>
