name: maggadit_customer
description: "Maggadit Food Industries — customer app (Flutter) connected to the Laravel API with Firebase push notifications."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # networking / state / storage
  dio: ^5.7.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2

  # ui helpers
  intl: ^0.20.2
  cached_network_image: ^3.4.1

  # firebase push notifications
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  flutter_local_notifications: ^19.4.2

  # files (invoice / quotation pdf)
  path_provider: ^2.1.4
  open_filex: ^4.6.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: AppFont
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
